<!-- Schema.org structured data for Person, Website and Blog -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ site.url }}/#person",
      "name": "Leonam Vasquez",
      "alternateName": "Leonam Ricardo Vasquez Ramos",
      "description": "DevOps Engineer com foco em Platform Engineering e automação de infraestrutura. Escreve sobre Terraform, OpenTofu, Terragrunt, HashiCorp Vault e Consul.",
      "jobTitle": "DevOps Engineer",
      "image": {{ site.avatar | absolute_url | jsonify }},
      "knowsAbout": ["Terraform", "OpenTofu", "Terragrunt", "HashiCorp Vault", "HashiCorp Consul", "Consul Template", "Infrastructure as Code", "Platform Engineering", "DevOps", "SRE", "Kubernetes", "Docker", "AWS", "Azure", "GCP", "Gestão de segredos", "Credenciais dinâmicas"],
      "url": "{{ site.url }}",
      "mainEntityOfPage": "{{ site.url }}/about/",
      "sameAs": [
        "https://github.com/leonamvasquez",
        "https://www.linkedin.com/in/leonamvasquez"
      ]
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}",
      "name": "Leonam Vasquez",
      "description": "Blog técnico bilíngue (português e inglês) sobre Terraform, OpenTofu, Terragrunt, HashiCorp Vault e Consul, Platform Engineering e segurança de credenciais.",
      "publisher": {
        "@id": "{{ site.url }}/#person"
      },
      "inLanguage": ["pt-BR", "en"]
    },
    {
      "@type": "Blog",
      "@id": "{{ site.url }}/#blog",
      "url": "{{ site.url }}",
      "name": "Blog de Leonam Vasquez",
      "description": "Artigos técnicos sobre Terraform, OpenTofu, Terragrunt, HashiCorp Vault, Consul, DevOps e Platform Engineering. Cada artigo existe em português e em inglês.",
      "author": {
        "@id": "{{ site.url }}/#person"
      },
      "publisher": {
        "@id": "{{ site.url }}/#person"
      },
      "isPartOf": {
        "@id": "{{ site.url }}/#website"
      },
      "inLanguage": ["pt-BR", "en"],
      "about": [
        {"@type": "Thing", "name": "Terraform"},
        {"@type": "Thing", "name": "OpenTofu"},
        {"@type": "Thing", "name": "Terragrunt"},
        {"@type": "Thing", "name": "HashiCorp Vault"},
        {"@type": "Thing", "name": "HashiCorp Consul"},
        {"@type": "Thing", "name": "Infrastructure as Code"}
      ]
    }
  ]
}
</script>

{% if page.layout == 'post' %}
{%- assign schema_summary = page.summary | default: page.description | default: page.excerpt -%}
<!-- Article Schema for Blog Posts -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": {{ page.title | jsonify }},
  "description": {{ schema_summary | strip_html | strip_newlines | truncate: 200 | jsonify }},
  "abstract": {{ schema_summary | strip_html | strip_newlines | jsonify }},
  "author": {
    "@type": "Person",
    "@id": "{{ site.url }}/#person",
    "name": "Leonam Vasquez",
    "url": "{{ site.url }}/about/"
  },
  "publisher": {
    "@type": "Person",
    "@id": "{{ site.url }}/#person",
    "name": "Leonam Vasquez"
  },
  "isPartOf": {
    "@id": "{{ site.url }}/#blog"
  },
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  "url": "{{ page.url | absolute_url }}",
  "inLanguage": "{% if page.lang == 'en' %}en{% else %}pt-BR{% endif %}",
  "keywords": {{ page.tags | join: ', ' | jsonify }},
  "articleSection": {{ page.categories | join: ', ' | jsonify }},
  "about": [{% for tag in page.tags %}{"@type": "Thing", "name": {{ tag | jsonify }}}{% unless forloop.last %}, {% endunless %}{% endfor %}],
  "image": {
    "@type": "ImageObject",
    "url": {{ page.image.path | default: page.image | default: site.social_preview_image | absolute_url | jsonify }}
  }
}
</script>

<!-- BreadcrumbList for navigation -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.categories | first | jsonify }},
      "item": "{{ site.url }}/categories/{{ page.categories | first | slugify }}/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
  ]
}
</script>
{% endif %}
